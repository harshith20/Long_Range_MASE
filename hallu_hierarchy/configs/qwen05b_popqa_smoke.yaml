# Smoke test: tiny model, 6 questions, checkpoint every 4 (exercises 2 chunks + resume).
# Run this first on Kaggle (a few minutes), then the dev config.
run_name: smoke_qwen0.5b_popqa6
seed: 0

model:
  id: Qwen/Qwen2.5-0.5B-Instruct
  revision: null
  dtype: float16
  device: cuda

data:
  dataset: popqa
  hf_id: akariasai/PopQA
  hf_split: test
  n_questions: 6
  split_fractions: {train: 0.6, val: 0.2, test: 0.2}

generation:
  system_prompt: "Answer the question with only the answer, in as few words as possible. Do not explain."
  max_new_tokens: 32
  n_samples: 3
  sample_temperature: 1.0
  sample_top_p: 1.0
  sample_top_k: 0
  layer_stride: 4
  checkpoint_every: 4
  resume_dirs: []

labeling:
  correctness:
    match_mode: contains

stages: [data, generate, correctness]
