# Full PopQA (14,267 questions): Qwen2.5-3B-Instruct on a Kaggle T4. Checkpoints every 100
# questions; if the session dies, rerun the same line and it resumes.
run_name: qwen2.5-3b_popqa_full
seed: 0
milestone: M1.6   # shown in REPORT.md
# output_root: defaults to /kaggle/working/outputs on Kaggle, hallu_hierarchy/outputs locally

model:
  id: Qwen/Qwen2.5-3B-Instruct
  revision: null        # pin a commit hash once the setup is final
  dtype: float16
  device: cuda

data:
  dataset: popqa
  hf_id: akariasai/PopQA
  hf_split: test
  n_questions: null     # all questions
  split_fractions: {train: 0.6, val: 0.2, test: 0.2}

generation:
  system_prompt: "Answer the question with only the answer, in as few words as possible. Do not explain."
  max_new_tokens: 32
  n_samples: 10
  sample_temperature: 1.0
  sample_top_p: 1.0     # 1.0 = off
  sample_top_k: 0       # 0 = off
  layer_stride: 4       # cache hidden-state indices 0, 4, 8, ... + last
  checkpoint_every: 100
  attn_row_layer_fracs: [0.5, 0.75, 0.9]   # layers for full TBG attention rows
  attn_row_max_len: 128                   # prompt tokens kept per row (NaN-padded)
  resume_dirs: []       # e.g. [/kaggle/input/<dataset-with-earlier-shards>]

correctness:                # CLAUDE.md §3; runs on saved generations (no GPU)
  refusal_patterns: configs/refusal_patterns.yaml
  generic_aliases: configs/generic_aliases.yaml
  head_words: configs/head_words.yaml
  relation_groups: configs/relation_groups.yaml
  relaxed_min_words: 2      # relaxed-only match (-> partial) needs the prediction to be >= 2 words ...
  relaxed_min_chars: 6      # ... or >= 6 characters
  ambiguous_single_word: true   # flag is a column only; excludes nothing
  ambiguous_subjects: []    # extra generic subject titles to flag
  # overrides: default overrides/<dataset>_<model>.csv (e.g. overrides/popqa_qwen2.5-3b.csv)
  # report checks (soft: outside the range -> WARN)
  expected_accuracy: [0.10, 0.30]   # PopQA; low accuracy is expected
  max_abstain_rate: 0.15
  max_partial_rate: 0.05
  max_relation_abstain_rate: 0.25      # WARN if one relation abstains more than this
  relation_abstain_review_rate: 0.10   # show example refusals for relations above this
  within_relation_min_test: 30         # correct and wrong per relation, all folds (H5)

entropy:                    # M2, CLAUDE.md §3 Entropy hierarchy (GPU only for the NLI part)
  subset: null              # all questions (E11 used a seeded random subset of 200)
  nli_model: microsoft/deberta-large-mnli
  nli_batch_size: 128       # pairs are short ("question answer"); length-sorted batches
  nli_autocast: false       # fp16 autocast overflowed inside DeBERTa on kernel v10 -> fp32 directly
  nli_with_question: true   # entailment between "question answer" strings, as in semantic entropy
  lens_layers: [18, 24, 30, 36]   # hidden-state indices (0 = embeddings, 36 = final, already normed)
  attn_layers: [18, 26, 32]       # transformer-block indices (0-based) for subject attention
  checkpoint_every: 100
  min_per_class: 30         # within-relation AUROC only for relations with >= this many per class

labeling:                   # M3, CLAUDE.md §3 AH vs UH labeling (CPU; internet for the first run, then cached)
  subset: null              # all eligible rows (E13 dev run: {wrong: 200, correct: 50})
  linked_counts: false      # E14: off — search is rate-limited (~10 s/request); cutoffs compared on E13's 200 rows
                            # cooc_count = pages with the answer that link to the subject page (+ subject page)
  count_cutoffs: [1, 3, 10] # rules "count>=k"; the "page" rule = answer on the subject page
  primary_rule: page        # rule behind `label_m3` until the manual check decides (§9)
  ambiguity_rule: answer_on_disambig   # decided after E14 (§9); disambig_exists reported as sensitivity analysis
  count_sample: null        # wrong rows that get counts + gold counts (null = all); search is rate-limited (~10 s/request in E13)
  count_correct: true       # counts for correct answers too (FA reference; half the sample size)
  request_interval_s: 0.1   # pause between Wikipedia API requests (serial, maxlag=5)
  # cache_dir: default <output_root>/wiki_cache (SQLite; reruns need no network)
  manual_check_n: 100

evaluation:                 # CLAUDE.md §3 Metrics
  folds: 5                  # subject-grouped k-fold CV; every question is tested once

# input_run_dir: on Kaggle, attached inputs are searched for a folder named <run_name>;
# set this (or --input-run-dir) only to point somewhere else.

stages: [data, generation, correctness]
