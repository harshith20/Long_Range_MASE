# M7 data generator config (plan §1, decisions D1–D9). Generator version is recorded in budget.json.
generator_version: gen-v0.2   # E20b: exp 1000 dropped, no filler around balancing mentions, city balancing
seed: 7020

lexicon:
  n_cities: 200
  n_universities: 60
  n_employers: 120
  n_first: 300
  n_middle: 300
  n_last: 400

factors:
  exp_birth: [1, 3, 10, 30, 100, 300]   # 1000 dropped (E20b: budget)
  ratio: [0, 1, 10, 30]          # work-city exposures = exp_birth * ratio, capped
  work_cap: 3000
  familiarity: {low: 3, high: 100}   # exposures of each of birth_date, university, major, employer
  people_per_cell_split: 150     # per (exp_birth, ratio, familiarity) cell and per split -> 16,800 people

city_balance: true               # E20b: spread birth/work-city mentions evenly over cities (frequency-guess confound)
name_balance: true               # D2: fact-free name mentions up to the ratio-max name count of the cell

cooccurrence:                    # D4
  max_partners: 3
  cross_max_per_person: 5        # exposures written inside a partner's document
  cross_fraction: 0.05

context_weights: {bio: 0.35, standalone: 0.25, news: 0.2, table: 0.2}   # cross docs are allocated separately
bio_attrs: [2, 5]                # facts per biography paragraph (if available)
table_attrs: [1, 4]
news_filler: [2, 3]              # fact-free sentences per news snippet
name_only_filler: [0, 0]         # E20b: balancing mention = one bare sentence (was [0, 2])

qa:                              # D6: parameter until the Allen-Zhu recipe is verified
  questions_per_attr: 3

tokenizer:
  vocab_size: 8192
  path: null                     # null = train a new BPE (on one biography per person + templates)

output:
  shuffle_buckets: 64
  shard_tokens: 100000000

budget:
  chars_per_token_guess: 4.0     # only for the estimate printed before anything is written
